<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM 리그 · 감독 모드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --app:#eceef3; --panel:#ffffff; --panel2:#f4f5f8; --rowalt:#f7f8fa; --hover:#eef0ff;
  --ink:#131720; --mute:#5f6878; --line:#e0e3ea; --line2:#eceef3;
  --nav:#12151d; --nav2:#1a1e29; --nav-ink:#aab2c2; --nav-act:#ffffff;
  --club:#5b3fd6; --accent:#5b3fd6; --accent-ink:#ffffff; --topink:#ffffff; --topmute:rgba(255,255,255,.68);
  --score:#151a24; --score-ink:#ffffff;
  --cl:#2f6fe0; --cc:#d9741c; --promo:#1a9a57; --releg:#d63c3c; --gold:#b8890a;
  --gk:#d99a00; --df:#2f74d8; --mf:#1a9a57; --fw:#d64545;
  --q1:#8a92a3; --q2:#c07d12; --q3:#4d9d2a; --q4:#1a8f73; --q5:#2f6fe0;
  --r0:#d65a3c; --r1:#c4972a; --r2:#5ea83a; --r3:#18905a;
  --pitch:#2d7a48; --pitch2:#2a7243; --pline:rgba(255,255,255,.55);
  --shadow:0 1px 2px rgba(16,20,30,.06),0 2px 8px rgba(16,20,30,.05);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --app:#0c0f15; --panel:#141922; --panel2:#1a2029; --rowalt:#171c25; --hover:#222840;
    --ink:#e8ecf3; --mute:#8b94a6; --line:#252c38; --line2:#1d232d;
    --nav:#0a0c11; --nav2:#141822;
    --score:#232a36; --score-ink:#ffffff;
    --cl:#5b93ff; --cc:#f39a45; --promo:#36c47d; --releg:#ff6366; --gold:#f2c230;
    --gk:#f0b429; --df:#4f8ff0; --mf:#2fbf72; --fw:#f06060;
    --q1:#7d8596; --q2:#e0a03a; --q3:#8fd14f; --q4:#33d1a0; --q5:#6fa8ff;
    --r0:#e2694b; --r1:#d8ad3c; --r2:#7cc24f; --r3:#2fbf72;
    --pitch:#1f5a35; --pitch2:#1c5331; --pline:rgba(255,255,255,.4);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --app:#0c0f15; --panel:#141922; --panel2:#1a2029; --rowalt:#171c25; --hover:#222840;
  --ink:#e8ecf3; --mute:#8b94a6; --line:#252c38; --line2:#1d232d;
  --nav:#0a0c11; --nav2:#141822;
  --score:#232a36; --score-ink:#ffffff;
  --cl:#5b93ff; --cc:#f39a45; --promo:#36c47d; --releg:#ff6366; --gold:#f2c230;
  --gk:#f0b429; --df:#4f8ff0; --mf:#2fbf72; --fw:#f06060;
  --q1:#7d8596; --q2:#e0a03a; --q3:#8fd14f; --q4:#33d1a0; --q5:#6fa8ff;
  --r0:#e2694b; --r1:#d8ad3c; --r2:#7cc24f; --r3:#2fbf72;
  --pitch:#1f5a35; --pitch2:#1c5331; --pline:rgba(255,255,255,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--app);color:var(--ink);font:14px/1.45 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--club) 40%,#0b0d12)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.n,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.muted{color:var(--mute)}
.up{color:var(--promo)}.down{color:var(--releg)}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand b{font-size:14px;line-height:1.25;display:block;color:#fff}
.brand small{display:block;color:var(--nav-ink);font-size:11.5px}
.navi{display:flex;flex-direction:column;gap:2px}
.navi button{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:9px 12px;border-radius:8px;color:var(--nav-ink);font-weight:500;text-align:left;position:relative}
.navi button:hover{background:var(--nav2);color:#fff}
.navi button[aria-current="page"]{background:var(--nav2);color:var(--nav-act);font-weight:700}
.navi button[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.navi svg,.bnav svg,.menu svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .foot{margin-top:auto;font-size:11.5px;padding:8px;display:flex;flex-direction:column;gap:6px}
.side .foot button{border:0;background:none;padding:0;color:var(--nav-ink);text-align:left;text-decoration:underline}

.wrap{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(100deg,color-mix(in srgb,var(--club) 55%,#0b0d12),color-mix(in srgb,var(--club) 22%,#0b0d12));color:var(--topink);display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--topink);display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0}
.crumb{font-size:12px;color:var(--topmute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl h1{margin:0;font-size:19px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.date{text-align:right;line-height:1.25;flex:none}
.date b{display:block;font-size:13px}
.date span{font-size:11.5px;color:var(--topmute)}
.go{flex:none;border:0;border-radius:8px;background:#fff;color:#12151d;padding:7px 20px;text-align:center;line-height:1.15;min-width:104px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.go b{display:block;font-size:15px}
.go span{font-size:11px;color:#5f6878}
.go:disabled{opacity:.6;cursor:default}
.go[hidden]{display:none}
.sub{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.sub[hidden]{display:none}
.chip{display:flex;align-items:center;gap:7px;flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-weight:500;color:var(--mute)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);font-weight:700;background:var(--hover)}
.flag{display:inline-block;width:18px;height:12px;border-radius:2px;flex:none;box-shadow:0 0 0 1px var(--line);vertical-align:-1px}
.lgm{display:inline-block;width:16px;height:16px;border-radius:4px;flex:none;box-shadow:0 0 0 1px var(--line);vertical-align:-3px}
main{padding:16px;max-width:1200px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding:11px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.panel h2{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent);flex:none}
.panel h2 small{font-weight:400;color:var(--mute);font-size:12px}
.pb{padding:12px 14px}
.pb>p{margin:0 0 8px}.pb>p:last-child{margin-bottom:0}
.ptabs{display:flex;gap:2px;background:var(--panel2);border-radius:8px;padding:3px;flex-wrap:wrap}
.ptabs button{border:0;background:transparent;color:var(--mute);padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap}
.ptabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
.cols .panel{margin-bottom:0}
.cols+.panel,.cols+.cols{margin-top:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack .panel{margin-bottom:0}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;font-weight:500;font-size:13px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.bad{color:var(--releg);border-color:color-mix(in srgb,var(--releg) 40%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lnk{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:7px;text-align:left;min-width:0;max-width:100%}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk:hover span{color:var(--accent);text-decoration:underline}
select,input[type=number],input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;max-width:100%}
.seg{display:flex;flex-wrap:wrap;gap:2px;border-radius:8px;padding:3px;background:var(--panel2)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:13px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--mute)}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{color:var(--mute);font-weight:600;font-size:11.5px;padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--panel2)}
.t th.l,.t td.l{text-align:left}
.t th button{border:0;background:none;padding:0;color:inherit;font:inherit}
.t th button[aria-pressed="true"]{color:var(--accent)}
.t td{height:36px;padding:0 6px;text-align:center;border-bottom:1px solid var(--line2);font:500 15px "Barlow Condensed","Arial Narrow",sans-serif;white-space:nowrap}
.t td.k{font:500 13px "Noto Sans KR",sans-serif}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr:nth-child(even){background:var(--rowalt)}
.t tbody tr[data-a]{cursor:pointer}
.t tbody tr[data-a]:hover{background:var(--hover)}
.t tr.me{background:color-mix(in srgb,var(--accent) 13%,transparent)!important}
.t tr.me td.club{font-weight:700}
.t td.pos{width:38px;font-weight:700;box-shadow:inset 3px 0 0 var(--zone,transparent);color:var(--zone,var(--ink))}
tr.z-cl{--zone:var(--cl)} tr.z-cc{--zone:var(--cc)} tr.z-promo{--zone:var(--promo)} tr.z-releg{--zone:var(--releg)}
.t td.club{text-align:left;font:500 13.5px "Noto Sans KR",sans-serif;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.t td.pts{font-weight:700;font-size:16px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:9px 14px;border-top:1px solid var(--line2);font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.ptag{display:inline-block;min-width:30px;text-align:center;border-radius:4px;padding:1px 5px;font:700 12px/1.45 "Barlow Condensed",sans-serif;background:var(--panel2);color:var(--ink);letter-spacing:.3px}
.ptag.g-gk{background:var(--gk);color:#1a1400}.ptag.g-df{background:var(--df);color:#fff}.ptag.g-mf{background:var(--mf);color:#fff}.ptag.g-fw{background:var(--fw);color:#fff}
.ca{font-weight:700}
.q1{color:var(--q1)}.q2{color:var(--q2)}.q3{color:var(--q3)}.q4{color:var(--q4)}.q5{color:var(--q5)}
.rp{display:inline-block;min-width:36px;border-radius:4px;padding:1px 5px;font:700 14px/1.45 "Barlow Condensed",sans-serif;color:#fff;text-align:center}
.rp.r0{background:var(--r0)}.rp.r1{background:var(--r1)}.rp.r2{background:var(--r2)}.rp.r3{background:var(--r3)}.rp.rn{background:var(--panel2);color:var(--mute)}
.tag{display:inline-block;font:500 11px/1.55 "Noto Sans KR",sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.tag.inj{color:#fff;background:var(--releg);border-color:var(--releg)}
.tag.lst{color:var(--cc);border-color:color-mix(in srgb,var(--cc) 50%,var(--line))}
.tag.ok{color:#fff;background:var(--promo);border-color:var(--promo)}
.cbar{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;vertical-align:middle}
.cbar i{display:block;height:100%}
.form5{display:inline-flex;gap:2px}
.form5 i{width:17px;height:17px;border-radius:4px;font:700 10px/17px "Noto Sans KR",sans-serif;color:#fff;text-align:center;font-style:normal}
.fW{background:var(--promo)}.fD{background:var(--q1)}.fL{background:var(--releg)}

.shield{display:inline-block;flex:none;padding:1px;background:rgba(0,0,0,.35);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.shield>i{display:flex;justify-content:center;width:100%;height:100%;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);background:linear-gradient(180deg,var(--c1) 0 55%,var(--c2) 55%);font:normal 700 15px/1 "Barlow Condensed",sans-serif;padding-top:22%}

.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line2)}
.fx:nth-child(even){background:var(--rowalt)}
.fx:last-child{border-bottom:0}
.fx .h{display:flex;justify-content:flex-end;min-width:0}
.fx .a{display:flex;min-width:0}
.fx .w span{font-weight:700}
.score{border:0;background:var(--score);color:var(--score-ink);font:700 15px/1 "Barlow Condensed",sans-serif;border-radius:6px;padding:6px 9px;min-width:54px;text-align:center;white-space:nowrap}
.fx .ex{grid-column:1/-1;text-align:center;font-size:11.5px;color:var(--mute);margin-top:-4px}
details.round{border-top:1px solid var(--line2)}
details.round:first-of-type{border-top:0}
details.round summary{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;font-weight:700;background:var(--panel2);list-style:none}
details.round summary::-webkit-details-marker{display:none}
details.round summary small{font-weight:400;color:var(--mute);font-size:12px}

.kv{display:grid;grid-template-columns:auto 1fr;margin:0}
.kv>div{display:contents}
.kv dt,.kv dd{margin:0;padding:9px 14px;border-bottom:1px solid var(--line2)}
.kv dt{color:var(--mute);white-space:nowrap}
.kv dd{font-weight:500}
.kv>div:last-child dt,.kv>div:last-child dd{border-bottom:0}

.phead{display:flex;align-items:center;gap:18px;padding:20px;border-radius:12px;margin-bottom:14px;flex-wrap:wrap;color:#fff;background:linear-gradient(115deg,color-mix(in srgb,var(--c1) 70%,#0b0d12) 0%,color-mix(in srgb,var(--c1) 35%,#0b0d12) 60%,color-mix(in srgb,var(--c2) 30%,#0b0d12) 100%);box-shadow:var(--shadow)}
.phead h2{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.3px}
.phead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;color:rgba(255,255,255,.85)}
.phead .meta .muted{color:rgba(255,255,255,.75)}
.phead .tag{color:#fff;border-color:rgba(255,255,255,.35)}
.phead .lnk span{color:#fff}
.phead .big{margin-left:auto;display:flex;gap:10px;text-align:center}
.phead .big>div{background:rgba(0,0,0,.25);border-radius:10px;padding:10px 14px;min-width:86px}
.phead .big b{display:block;font:700 30px/1 "Barlow Condensed",sans-serif;color:#fff}
.phead .big b .ca{color:#fff}
.phead .big small{color:rgba(255,255,255,.75);font-size:11.5px}
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.attrs section{padding:10px 14px}
.attrs h3{margin:0 0 6px;font-size:12px;color:var(--mute);font-weight:600}
.at{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.at span{flex:1;color:var(--ink)}
.at b{font:700 15px/1.5 "Barlow Condensed",sans-serif;min-width:38px;text-align:center;border-radius:4px;color:#fff;background:var(--q1)}
.at b u{text-decoration:none;color:#fff}
.at.q2 b{background:var(--q2)}.at.q3 b{background:var(--q3)}.at.q4 b{background:var(--q4)}.at.q5 b{background:var(--q5)}
.at .bar{flex:0 0 60px;height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}.at .bar i{display:block;height:100%;background:var(--q1)}
.at.q2 .bar i{background:var(--q2)}.at.q3 .bar i{background:var(--q3)}.at.q4 .bar i{background:var(--q4)}.at.q5 .bar i{background:var(--q5)}
.trlist{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.trait{border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:var(--rowalt);border-left:3px solid var(--promo)}
.trait.bad{border-left-color:var(--releg)}
.trait b{display:block;font-size:13px}
.trait span{font-size:12px;color:var(--mute)}
.posmap{position:relative;aspect-ratio:68/100;width:150px;margin:12px auto;border-radius:6px;background:var(--pitch);border:2px solid var(--pline)}
.posmap i{position:absolute;transform:translate(-50%,50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 10px "Barlow Condensed",sans-serif;font-style:normal;color:#fff;border:2px solid rgba(255,255,255,.7)}

.news{display:flex;flex-direction:column}
.news article{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line2)}
.news article:last-child{border-bottom:0}
.news .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--panel2);font-size:15px}
.news article.imp .ic{background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.news b{display:block;font-size:13.5px}
.news p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.news small{font-size:11.5px;color:var(--mute)}
.offer{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.offer:last-child{border-bottom:0}
.offer .txt{flex:1;min-width:200px}

.nextm{position:relative;border-radius:12px;overflow:hidden;margin-bottom:14px;color:#fff;background:linear-gradient(110deg,color-mix(in srgb,var(--h1) 75%,#0b0d12) 0%,#12151d 50%,color-mix(in srgb,var(--a1) 75%,#0b0d12) 100%);box-shadow:var(--shadow)}
.nextm .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:20px 18px 12px}
.nextm .tm{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:700;font-size:15px;min-width:0}
.nextm .tm .lnk span{color:#fff}
.nextm .vs{text-align:center}
.nextm .vs b{display:block;font:700 30px/1 "Barlow Condensed",sans-serif;letter-spacing:1px}
.nextm .vs small{color:rgba(255,255,255,.7);font-size:12px}
.nextm .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px 16px;font-size:13px;color:rgba(255,255,255,.8);border-top:1px solid rgba(255,255,255,.1)}

.pitch::after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:13%;border:2px solid var(--pline);border-bottom:0}
.tok{position:absolute;transform:translate(-50%,50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:80px;z-index:1}
.tok b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 13px "Barlow Condensed",sans-serif;background:#fff;color:#12151d;border:2px solid var(--accent)}

.tac small{grid-column:2;color:var(--mute);font-size:12px;margin-top:-2px}

.board .tm.r{justify-content:flex-end;text-align:right}

.feed .red span::before{content:"";display:inline-block;width:8px;height:11px;background:#e03131;border-radius:1px;margin-right:6px;vertical-align:-1px}

function available(c){return c.sq.map(P).filter(p=>p&&p.inj<=0)}
function condW(p){return p.cond>=85?1:0.7+0.3*p.cond/85}
function autoXI(c,form){
  form=form||c.form;const slots=FORM[form],avail=available(c),used=new Set(),xi=[];
  const order=slots.map((s,i)=>i).sort((a,b)=>(slots[a][0]==='GK'?-1:0)-(slots[b][0]==='GK'?-1:0));
  const res=new Array(slots.length);
  for(const i of order){const pos=slots[i][0];let best=null,bv=-1;
    for(const p of avail){if(used.has(p.id))continue;const v=eff(p,pos)*condW(p);if(v>bv){bv=v;best=p}}
    if(best){used.add(best.id);res[i]={pid:best.id,role:defaultRole(best,pos)}}else res[i]=null}
  const rest=avail.filter(p=>!used.has(p.id)).sort((a,b)=>ovr(b)*condW(b)-ovr(a)*condW(a));
  const bench=[];const gk=rest.find(p=>p.pos==='GK');if(gk)bench.push(gk.id);
  for(const p of rest){if(bench.length>=7)break;if(!bench.includes(p.id))bench.push(p.id)}
  return{xi:res,bench};
}
function defaultRole(p,pos){
  if(pos==='ST'){if(p.a[11]+p.a[14]>p.a[0]+p.a[1]+20)return'타겟맨';if(p.a[0]+p.a[1]>p.a[2]+p.a[3]+25)return'침투형';return'피니셔'}
  if(pos==='LW'||pos==='RW')return p.a[3]+p.a[2]>p.a[4]+p.a[5]?'인사이드 포워드':'전통 윙어';
  return ROLES[pos][0];
}
function strength(c){const{xi}=autoXI(c);let s=0,n=0;FORM[c.form].forEach((sl,i)=>{if(xi[i]){s+=eff(P(xi[i].pid),sl[0]);n++}});return n?s/11:0}
function bestFormation(c){let best='4-3-3',bv=-1;for(const f in FORM){const{xi}=autoXI(c,f);let s=0;FORM[f].forEach((sl,i)=>{if(xi[i])s+=eff(P(xi[i].pid),sl[0])});if(s>bv){bv=s;best=f}}return best}
function aiSetup(c){c.form=bestFormation(c);const r=c.rep;
  c.tac={ment:r>75?3:r<45?1:2,line:r>70?2:r<45?0:1,press:R()<.4?2:1,speed:1,pass:R()<.3?0:R()<.5?2:1,counter:r<60&&R()<.6?1:0,mark:R()<.2?1:0,tempo:1}}
// 사용자 라인업 검증 (부상자 자동 교체)
function userLineup(c){
  const slots=FORM[c.form];const auto=autoXI(c);
  if(!c.xi||c.xi.length!==slots.length)c.xi=auto.xi.map(x=>x&&{...x});
  const used=new Set();const xi=c.xi.map((x,i)=>{
    const ok=x&&P(x.pid)&&P(x.pid).club===c.id&&c.sq.includes(x.pid)&&P(x.pid).inj<=0&&!used.has(x.pid);
    if(ok){used.add(x.pid);return{pid:x.pid,role:ROLES[slots[i][0]].includes(x.role)?x.role:defaultRole(P(x.pid),slots[i][0])}}
    return null});
  const avail=available(c).filter(p=>!used.has(p.id));
  xi.forEach((x,i)=>{if(x)return;const pos=slots[i][0];let best=null,bv=-1;for(const p of avail){if(used.has(p.id))continue;const v=eff(p,pos)*condW(p);if(v>bv){bv=v;best=p}}
    if(best){used.add(best.id);xi[i]={pid:best.id,role:defaultRole(best,pos)}}});
  let bench=(c.bench||[]).filter(id=>P(id)&&c.sq.includes(id)&&P(id).inj<=0&&!used.has(id));
  bench=[...new Set(bench)];
  for(const p of available(c).filter(p=>!used.has(p.id)&&!bench.includes(p.id)).sort((a,b)=>ovr(b)-ovr(a))){if(bench.length>=7)break;bench.push(p.id)}
  bench=bench.slice(0,7);
  return{xi,bench};
}

    c.coh=clamp(c.coh+(isUser(c)&&c.train.foc==='전술'?0.5:0.15),0,100);

function slotEvents(){

function moveTo(p,to,fee,loan){
  const from=p.club?K(p.club):null;
  if(from){from.sq=from.sq.filter(x=>x!==p.id);from.yt=from.yt.filter(x=>x!==p.id);if(from.xi)from.xi=from.xi.map(x=>x&&x.pid===p.id?null:x);if(from.bench)from.bench=from.bench.filter(x=>x!==p.id);from.coh=clamp(from.coh-0.5,0,100)}
  else G.FA=G.FA.filter(x=>x!==p.id);
  if(to){to.sq.push(p.id);p.club=to.id;to.coh=clamp(to.coh-1.5,0,100)}else{p.club=null;G.FA.push(p.id)}
  if(fee>0&&from&&to){spend(to,'tout',fee);income(from,'tin',fee)}
  p.lst=false;p.mor=72;
  G.TL.unshift({s:G.season,d:G.slot,pid:p.id,n:p.n,f:from?from.id:null,t:to?to.id:null,fee:r1(fee||0),loan:!!loan});if(G.TL.length>250)G.TL.length=250;
}
function slotWeakness(c){const{xi}=autoXI(c),sl=FORM[c.form];let worst=null;sl.forEach((s,i)=>{const v=xi[i]?eff(P(xi[i].pid),s[0]):0;if(!worst||v<worst.v)worst={pos:s[0],v}});return worst}
function aiTransfers(){
  const ids=Object.keys(G.K).filter(id=>!isUser(id));
  for(let n=0;n<10;n++){const c=K(pick(ids));if(c.cash<5||c.sq.length>=28)continue;
    const w=slotWeakness(c);if(!w)continue;const minV=w.v+8;
    let best=null;
    const pool=[];for(let k=0;k<260;k++){const o=K(pick(ids));if(o===c||o.rep>c.rep+4)continue;const pid=pick(o.sq);if(pid)pool.push(pid)}
    pool.push(...G.FA);
    for(const pid of pool){const p=P(pid);if(!p||p.loan||p.age>31||(p.pos!==w.pos&&!p.alt.includes(w.pos)))continue;const v=eff(p,w.pos);if(v<minV)continue;
      const fee=p.club?value(p)*1.15:0;if(fee>c.cash*0.5)continue;if(!best||v>best.v)best={p,v,fee}}
    if(best){const p=best.p,from=p.club?K(p.club):null;p.wage=wageFor(p,c.rep);p.cEnd=G.season+rint(1,4);moveTo(p,c,best.fee);
      if(from&&from.sq.length<20)refill(from)}}
}
function refill(c){while(c.sq.length<22){const w=slotWeakness(c)||{pos:pick(POS)};
  const fa=G.FA.map(P).filter(p=>p&&(p.pos===w.pos||p.alt.includes(w.pos))).sort((a,b)=>ovr(b)-ovr(a))[0];
  if(fa&&ovr(fa)>clubTarget(c.rep)-30){fa.wage=wageFor(fa,c.rep);fa.cEnd=G.season+rint(0,2);moveTo(fa,c,0)}
  else{const p=genPlayer(R()<.8?c.cid:pick(COUNTRIES).id,w.pos,clubTarget(c.rep)-rint(5,18),rint(18,30));p.club=c.id;p.wage=wageFor(p,c.rep);p.cEnd=G.season+rint(1,3);c.sq.push(p.id)}}}
function aiOffers(){
  const u=K(G.user);if(!u)return;
  for(const pid of u.sq){const p=P(pid);if(!p||p.loan)continue;if(G.offers.some(o=>o.pid===pid))continue;
    const v=value(p);const prob=p.lst?0.35:(v>3?0.035:0.01);if(R()>prob)continue;
    const bidders=Object.values(G.K).filter(c=>!isUser(c)&&c.cash>v*1.1&&c.rep>=u.rep-12&&(slotWeakness(c)||{v:999}).v<ovr(p)+5);
    if(!bidders.length)continue;const b=pick(bidders);
    const fee=r1(v*(p.lst?rint(78,102):rint(100,135))/100);

    news(`이적 제안: ${p.n}`,`${b.name}${ps(b.name,'가')} ${p.n} 영입에 ${money(fee)}을 제안했어요.`,true)}
  G.offers=G.offers.filter(o=>o.exp>G.slot&&P(o.pid)&&P(o.pid).club===G.user);
}
function askPrice(p){const c=K(p.club);const{xi}=autoXI(c);const starter=xi.some(x=>x&&x.pid===p.id);
  return r1(value(p)*(starter?1.35:1.05)*(yl(p)<=0?0.8:1))}
function willJoin(p,c){const from=p.club?K(p.club):null;if(!from)return{ok:true};
  if(c.rep<from.rep-20)return{ok:false,why:`${p.n}${ps(p.n,'는')} 더 큰 클럽에서 뛰고 싶어해요.`};return{ok:true}}
function wageDemand(p,c){const from=p.club?K(p.club):null;let w=wageFor(p,c.rep);if(from&&c.rep<from.rep)w*=1.15;if(p.age>=31)w*=0.9;return r2(w)}

function genYouth(nat,c,q,fpos){const age=rint(15,17),pos=fpos||pick(['GK','CB','CB','LB','RB','DM','CM','CM','AM','LW','RW','ST','ST']);
  const tgt=clamp(clubTarget(c.rep)*0.42+c.fac.yo*3+(q||0)+gauss()*9,20,120);
  const p=genPlayer(nat,pos,tgt,age);let pa=ovr(p)+rint(20,65)+c.fac.yo*2+(q||0);
  if(R()<0.012+0.004*c.fac.yo)pa+=rint(30,60);p.pa=clamp(pa,ovr(p),200);p.wage=0.1;p.cEnd=G.season+3;return p}
function youthIntake(){
  for(const id in G.K){const c=G.K[id];const n=isUser(c)?3+Math.floor(c.fac.yo/3):rint(2,4);const got=[];
    for(let i=0;i<n;i++){const p=genYouth(R()<.88?c.cid:pick(COUNTRIES).id,c);p.club=c.id;
      if(isUser(c)){c.yt.push(p.id);got.push(p)}
      else if(p.pa>clubTarget(c.rep)+5){c.sq.push(p.id);trimAI(c)}else delete G.P[p.id]}
    if(isUser(c))news('유스 선수 입단',`올해 유스 인테이크로 ${got.length}명이 들어왔어요: ${got.map(p=>`${p.n}(${p.pos})`).join(', ')}.`,true)}
}
function trimAI(c){while(c.sq.length>27){const worst=c.sq.map(P).filter(p=>!p.loan).sort((a,b)=>(ovr(a)-(a.age<21?15:0))-(ovr(b)-(b.age<21?15:0)))[0];if(!worst)break;moveTo(worst,null,0)}}

function sendScout(cid,pos){const c=K(G.user),cost=scoutCost(c);if(c.cash<cost)return'예산이 부족해요.';if(G.scoutPending)return'이미 스카우트가 활동 중이에요.';
  spend(c,'fac',cost);G.scoutPending={cid,pos,at:G.slot+2};return null}
function deliverScout(){const sp=G.scoutPending,c=K(G.user);G.scoutPending=null;
  for(let i=0;i<3;i++){const p=genYouth(sp.cid,{rep:c.rep,fac:{yo:c.fac.sc}},c.fac.sc*1.5,sp.pos!=='전체'?sp.pos:null);
    p.age=rint(16,18);p.club=null;p.fee=r1(0.3+value(p)*0.4);G.scout.push(p.id)}

function setExpectation(){if(!G.user)return;const u=K(G.user),t=tierOf(u),ids=G.D[u.cid][t];
  const rank=[...ids].sort((a,b)=>strength(K(b))-strength(K(a))).indexOf(u.id)+1;

function endSeason(){
  const S=G.season,rec={season:S,champs:[],awards:[]};

    tb.forEach((r,i)=>{const c=K(r.id);c.hist.push({s:S,t,pos:i+1,p:r.p,w:r.w,d:r.d,l:r.l,gf:r.gf,ga:r.ga,pts:r.pts});
      income(c,'tv',r1(TV[t]*(1+(tb.length-i)/tb.length*0.6)))});
    const ch=K(tb[0].id);ch.tro[co.leagues[t]]=(ch.tro[co.leagues[t]]||0)+1;rec.champs.push([co.leagues[t],ch.id])}
  for(const id in G.C){const c=G.C[id];if(c.type!=='L'&&c.win)rec.champs.push([c.name,c.win])}
  // 2) 개인 수상 (각 리그 1부)
  for(const co of COUNTRIES){const ids=G.D[co.id][0],ps=ids.flatMap(id=>K(id).sq.map(P)).filter(Boolean),L=co.leagues[0];
    const top=(f,flt)=>ps.filter(flt||(()=>true)).sort((a,b)=>f(b)-f(a))[0];
    const aw=[['득점왕',top(p=>p.st.lg*100+p.st.lA),p=>`${p.st.lg}골`],['도움왕',top(p=>p.st.lA*100+p.st.lg),p=>`${p.st.lA}도움`],
      ['올해의 선수',top(p=>p.st.la?p.st.lr/p.st.la:0,p=>p.st.la>=12),p=>`평점 ${r2(p.st.lr/p.st.la).toFixed(2)}`],['영플레이어',top(p=>p.st.la?p.st.lr/p.st.la:0,p=>p.age<=21&&p.st.la>=8),p=>`평점 ${r2(p.st.lr/p.st.la).toFixed(2)}`]];
    for(const[k,p,f]of aw)if(p){p.aw.push([S,`${L} ${k}`]);rec.awards.push([L,k,p.id,p.n,p.club,f(p)])}}
  G.rec.seasons.unshift(rec);
  // 3) 감독 기록
  if(G.user){const u=K(G.user),h=u.hist[u.hist.length-1];G.mgr.hist.push({s:S,club:u.id,t:h.t,pos:h.pos,w:h.w,d:h.d,l:h.l,tro:rec.champs.filter(x=>x[1]===u.id).map(x=>x[0]),exp:G.exp&&G.exp.txt,ok:G.exp?h.pos<=G.exp.goal:null});
    mediaSeasonEnd(h.pos,G.exp?h.pos<=G.exp.goal:false);
    if(G.exp){const ok=h.pos<=G.exp.goal;news(ok?'시즌 목표 달성':'시즌 목표 미달',`목표는 ${G.exp.txt}였고 ${h.pos}위로 마쳤어요.`,true);u.fans=clamp(u.fans+(ok?6:-6),5,100)}}
  // 4) 리그 간 대회 진출 자료
  G.prev=COUNTRIES.map(co=>({ranks:tables[co.id+0].map(r=>r.id),cup:G.C['FA:'+co.id].win}));
  G.prevCont=G.C.CL.win&&G.C.CC.win?{cl:G.C.CL.win,cc:G.C.CC.win}:null;
  // 5) 승강
  for(const co of COUNTRIES){const D=G.D[co.id];
    for(let t=0;t<2;t++){const down=tables[co.id+t].slice(-2).map(r=>r.id),up=tables[co.id+(t+1)].slice(0,2).map(r=>r.id);
      D[t]=D[t].filter(x=>!down.includes(x)).concat(up);D[t+1]=D[t+1].filter(x=>!up.includes(x)).concat(down);
      if(involves(up))news('승격 확정',`${K(G.user).name}${ps(K(G.user).name,'가')} ${co.leagues[t]}${ps(co.leagues[t],'로')} 승격해요!`,true);if(involves(down))news('강등',`${K(G.user).name}${ps(K(G.user).name,'가')} ${co.leagues[t+1]}${ps(co.leagues[t+1],'로')} 강등돼요.`,true)}}
  // 6) 평판
  for(const co of COUNTRIES)for(let t=0;t<3;t++){const tb=tables[co.id+t],order=[...tb].sort((a,b)=>K(b.id).rep-K(a.id).rep).map(x=>x.id);
    tb.forEach((r,i)=>{const c=K(r.id),exp=order.indexOf(r.id);c.rep=clamp(Math.round(c.rep+(exp-i)*0.5+(i===0?2:0)+(t===0?0.3:-0.3)),10,99)})}
  // 7) 선수: 커리어 기록, 나이, 은퇴, 계약, 임대
  for(const id in G.P){const p=G.P[id];
    if(p.st.ap>0){const c=p.club?K(p.club):null;p.car.push([S,p.club,c?tierOf(c):-1,p.st.ap,p.st.g,p.st.a,p.st.ap?r2(p.st.rs/p.st.ap):0,p.st.mo])}
    p.hist.push([S,ovr(p)]);p.st=newSt();p.age++;p.wk=[];}
  for(const id of Object.keys(G.P)){const p=G.P[id];
    if(p.loan&&p.loan.s<=S){const home=K(p.loan.from);const cur=K(p.club);if(cur){cur.sq=cur.sq.filter(x=>x!==p.id)}p.club=home.id;home.sq.push(p.id);p.loan=null;if(isUser(home))news(`임대 복귀: ${p.n}`,`${p.n}${ps(p.n,'가')} 임대를 마치고 돌아왔어요.`)}

  // 유스 19세 이상 자동 승격
  const u=G.user&&K(G.user);if(u)for(const id of [...u.yt]){const p=P(id);if(p.age>=19){u.yt=u.yt.filter(x=>x!==id);u.sq.push(id);news(`1군 승격: ${p.n}`,`${p.n}${ps(p.n,'가')} 나이 제한으로 1군에 올라왔어요.`)}}

}
function retire(p){const c=p.club?K(p.club):null;
  if(c){c.sq=c.sq.filter(x=>x!==p.id);c.yt=c.yt.filter(x=>x!==p.id);if(c.xi)c.xi=c.xi.map(x=>x&&x.pid===p.id?null:x);if(c.bench)c.bench=c.bench.filter(x=>x!==p.id)}

function fxRow(f){const r=f.r,hw=r&&r.w?r.w===f.h:r&&r.hg>r.ag,aw=r&&r.w?r.w===f.a:r&&r.ag>r.hg;const ex=[];if(r&&r.et)ex.push('연장');if(r&&r.pen)ex.push(`승부차기 ${r.pen[0]}-${r.pen[1]}`);

function zoneOf(t,rank,size){if(t===0){if(rank<=4)return'z-cl';if(rank<=7)return'z-cc';if(rank>size-2)return'z-releg';return''}if(rank<=2)return'z-promo';if(t===1&&rank>size-2)return'z-releg';return''}

const POSORD=Object.fromEntries(POS.map((p,i)=>[p,i]));
function squadRows(ids,cols){
  const ps=ids.map(P).filter(Boolean),k=S.sq.sort,d=S.sq.dir;
  const key={pos:p=>POSORD[p.pos]*1000-ovr(p),name:p=>p.n,age:p=>p.age,ca:p=>-ovr(p),pa:p=>-paRange(p)[1],cond:p=>-p.cond,mor:p=>-p.mor,rt:p=>-(p.st.ap?p.st.rs/p.st.ap:0),ap:p=>-p.st.ap,g:p=>-p.st.g,a:p=>-p.st.a,val:p=>-value(p),wage:p=>-p.wage,con:p=>p.cEnd}[k]||(p=>POSORD[p.pos]);
  ps.sort((a,b)=>{const x=key(a),y=key(b);return(x<y?-1:x>y?1:0)*d});
  return ps;
}

  const car=p.car.length?`<div class="scroll"><table class="t"><thead><tr><th>시즌</th><th class="l">클럽</th><th>출전</th><th>골</th><th>도움</th><th>평점</th></tr></thead><tbody>${p.car.slice().reverse().map(x=>`<tr><td>${seasonLabel(x[0])}</td><td class="club">${x[1]&&K(x[1])?cl(x[1]):'-'}</td><td>${x[3]}</td><td>${x[4]}</td><td>${x[5]}</td><td>${x[6]||'-'}</td></tr>`).join('')}<tr><td class="k">통산</td><td></td><td>${tot[0]}</td><td>${tot[1]}</td><td>${tot[2]}</td><td></td></tr></tbody></table></div>`:'<div class="pb muted">아직 지난 시즌 기록이 없어요.</div>';
  const aw=p.aw.length?`<dl class="kv">${p.aw.slice().reverse().map(a=>`<div><dt>${seasonLabel(a[0])}</dt><dd>${a[1]}</dd></div>`).join('')}</dl>`:'<div class="pb muted">아직 수상 기록이 없어요.</div>';
  // 행동
  let act='';
  if(p.club===G.user&&p.loan&&p.loan.from!==G.user){
    act=`<div class="pb"><p>${K(p.loan.from).name}에서 이번 시즌 끝까지 임대 온 선수예요.</p><div class="btns"><button class="btn" data-a="loanEnd" data-id="${p.id}">임대 조기 종료</button></div></div>`}
  else if(me&&p.club===G.user){const isY=u.yt.includes(p.id);
    act=`<div class="pb"><div class="form"><div class="field"><label>개인 훈련 집중</label><select data-ch="focus" data-id="${p.id}">${Object.keys(FOCUS).map(k=>`<option ${p.foc===k?'selected':''}>${k}</option>`).join('')}</select></div></div></div>
      <div class="pb" style="padding-top:0"><div class="btns">${isY?`<button class="btn pri" data-a="promote" data-id="${p.id}">1군 승격</button>`:`<button class="btn" data-a="renew" data-id="${p.id}">재계약 협상</button><button class="btn" data-a="list" data-id="${p.id}">${p.lst?'이적 명단에서 빼기':'이적 명단 등록'}</button><button class="btn" data-a="loanOut" data-id="${p.id}" ${inWindow()&&p.age<=25?'':'disabled'}>임대 보내기</button>`}<button class="btn bad" data-a="release" data-id="${p.id}">방출</button></div>
      ${!isY&&p.age>25?'<p class="muted" style="font-size:12px;margin:8px 0 0">임대는 25세 이하 선수만 보낼 수 있어요.</p>':''}</div>`;
  }else if(!me){const sl=G.short.includes(p.id);
    act=`<div class="pb"><div class="btns">${p.club?`<button class="btn pri" data-a="bid" data-id="${p.id}" ${inWindow()?'':'disabled'}>영입 제안</button><button class="btn" data-a="loanIn" data-id="${p.id}" ${inWindow()&&p.age<=23?'':'disabled'}>임대 제안</button>`:`<button class="btn pri" data-a="signFA" data-id="${p.id}">계약 제안</button>`}<button class="btn" data-a="short" data-id="${p.id}">${sl?'관심 목록에서 빼기':'관심 목록 추가'}</button></div>
      ${p.club&&!inWindow()?'<p class="muted" style="font-size:12px;margin:8px 0 0">이적 시장이 닫혀 있어요. 여름(7~8월)과 겨울(1월)에 열려요.</p>':''}</div>`}
  return{crumb:c?`${c.name} › 선수`:'자유계약 선수',title:p.n,body:head+`<div class="cols"><div class="stack">${panel('능력치',attrHtml(p))}${panel('개성',tr)}${act?panel('관리',act):''}</div><div class="stack">${panel('선수 정보',info)}${panel('포지션',posmap+'<div class="legend"><span><i style="background:var(--r3)"></i>주 포지션급</span><span><i style="background:var(--r2)"></i>잘 소화</span><span><i style="background:var(--r1)"></i>소화 가능</span></div>')}${panel(`${seasonLabel(G.season)} 시즌`,seasonSt)}${panel('능력 변화',caChart(p))}${panel('커리어',car)}${panel('개인 수상',aw)}</div></div>`};

V.training=()=>{const u=K(G.user),tr=u.train;
  const tfd={'균형':'모든 능력치를 고르게 키워요','공격':'슈팅·드리블·패스 위주로 성장해요','수비':'태클·대인 수비·위치 선정 위주로 성장해요','체력':'체력·속도·몸싸움 위주로 성장해요','전술':'판단력·시야가 크고, 조직력이 빨리 올라요'};
  const ind=['회복이 빠르고 부상 위험이 낮지만 성장이 느려요','성장과 회복의 균형이 맞아요','성장이 빠르지만 회복이 느리고 부상 위험이 커요'];
  const rows=u.sq.concat(u.yt).map(P).sort((a,b)=>POSORD[a.pos]-POSORD[b.pos]||ovr(b)-ovr(a)).map(p=>{const d=p.wk.length>=5?ovr(p)-p.wk[p.wk.length-5]:null;
    return`<tr><td>${ptag(p.pos)}</td><td class="k l">${pl(p)}${u.yt.includes(p.id)?'<span class="tag">유스</span>':''}${p.inj>0?'<span class="tag inj">부상</span>':''}</td><td>${p.age}</td><td>${caB(ovr(p))}</td><td>${caB(p.pa)}</td><td>${d===null?'<span class="muted">-</span>':d>0?`<span class="up">+${d}</span>`:d<0?`<span class="down">${d}</span>`:'0'}</td><td class="hide-sm">${cbar(p.cond)}</td>
    <td><select data-ch="focus" data-id="${p.id}">${Object.keys(FOCUS).map(k=>`<option ${p.foc===k?'selected':''}>${k}</option>`).join('')}</select></td></tr>`}).join('');
  return{crumb:u.name,title:'훈련',body:`<div class="cols">${panel('팀 훈련',`<div class="tac"><span>훈련 집중</span>${seg(Object.keys(TFOCUS),Object.keys(TFOCUS).indexOf(tr.foc),'tfoc')}<small>${tfd[tr.foc]}</small></div><div class="tac"><span>훈련 강도</span>${seg(INT,tr.int,'tint')}<small>${ind[tr.int]}</small></div>`)}
    ${panel('훈련 환경',`<dl class="kv"><div><dt>훈련 시설</dt><dd>${u.fac.tr}단계 · 성장 속도 ×${(0.75+0.05*u.fac.tr).toFixed(2)}</dd></div><div><dt>유소년 시설</dt><dd>${u.fac.yo}단계</dd></div><div><dt>조직력</dt><dd>${cbar(u.coh)} ${Math.round(u.coh)}%</dd></div></dl><div class="pb muted" style="font-size:12.5px">선수는 나이가 어리고 잠재력과 현재 능력의 차이가 클수록 빨리 자라요. 경기에 꾸준히 나가야 성장이 붙고, 30세가 넘으면 신체 능력이 떨어지기 시작해요.</div>`)}</div>
    ${panel('선수별 훈련',`<div class="scroll"><table class="t"><thead><tr><th>포지션</th><th class="l">이름</th><th>나이</th><th>능력</th><th>잠재력</th><th>4주 변화</th><th class="hide-sm">컨디션</th><th>개인 훈련</th></tr></thead><tbody>${rows}</tbody></table></div>`)}`};
};

V.tactics=()=>{const u=K(G.user);const lu=userLineup(u);u.xi=lu.xi;u.bench=lu.bench;
  const slots=FORM[u.form],xiIds=new Set(lu.xi.filter(Boolean).map(x=>x.pid));
  const pitch=`<div class="pitch">${slots.map((s,i)=>{const x=lu.xi[i],p=x&&P(x.pid);const e=p?Math.round(eff(p,s[0])):0;return`<div class="tok ${p&&fit(p,s[0])<.8?'warn':''}" style="left:${s[1]}%;bottom:${s[2]}%"><b>${e||'?'}</b><span>${p?p.n.split(' ').pop():'비어 있음'}</span></div>`}).join('')}</div>`;
  const opts=(pos,cur)=>u.sq.map(P).filter(p=>p.inj<=0).sort((a,b)=>eff(b,pos)-eff(a,pos)).map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${p.n} · ${p.pos} ${Math.round(eff(p,pos))}${xiIds.has(p.id)&&p.id!==cur?' (선발)':''}${p.cond<75?` · 컨디션 ${Math.round(p.cond)}%`:''}</option>`).join('');
  const slotRows=slots.map((s,i)=>{const x=lu.xi[i];const p=x&&P(x.pid);return`<div class="slot">${ptag(s[0])}<select data-ch="xi" data-i="${i}" aria-label="${s[0]} 선수"><option value="">비워 두기</option>${opts(s[0],x&&x.pid)}</select><select data-ch="role" data-i="${i}" aria-label="역할">${ROLES[s[0]].map(r=>`<option ${x&&x.role===r?'selected':''}>${r}</option>`).join('')}</select><span class="e ${p?qc(eff(p,s[0])):''}">${p?Math.round(eff(p,s[0])):'-'}</span></div>`}).join('');
  const roleHelp=[...new Set(lu.xi.filter(Boolean).map(x=>x.role))].filter(r=>RDESC[r]).map(r=>`<b>${r}</b>: ${RDESC[r]}`).join('<br>');
  const benchOpts=cur=>u.sq.map(P).filter(p=>p.inj<=0&&!xiIds.has(p.id)).sort((a,b)=>POSORD[a.pos]-POSORD[b.pos]||ovr(b)-ovr(a)).map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${p.pos} ${p.n} ${ovr(p)}</option>`).join('');
  const bench=Array.from({length:7},(_,i)=>`<div class="slot" style="grid-template-columns:40px 1fr">${ptag('S'+(i+1))}<select data-ch="bench" data-i="${i}"><option value="">비워 두기</option>${benchOpts(lu.bench[i])}</select></div>`).join('');
  const tac=TACO.map(([k,l,o,d])=>`<div class="tac"><span>${l}</span>${seg(o,u.tac[k],'tac',`data-k="${k}"`)}<small>${d}</small></div>`).join('');
  const warn=lu.xi.map((x,i)=>x&&fit(P(x.pid),slots[i][0])<.8?`${P(x.pid).n}${ps(P(x.pid).n,'는')} ${slots[i][0]} 자리가 낯설어요`:null).filter(Boolean);
  return{crumb:u.name,title:'전술',body:`<div class="cols"><div class="stack">${panel('포메이션',`<div class="pb">${seg(Object.keys(FORM),Object.keys(FORM).indexOf(u.form),'form')}</div>${pitch}<div class="pb" style="padding-top:0"><div class="btns"><button class="btn" data-a="autoXI">최적 라인업 자동 선택</button></div>${warn.length?`<p class="muted" style="font-size:12.5px;margin:8px 0 0">${warn.join('<br>')}</p>`:''}</div>`)}
    ${panel('팀 지시',tac)}</div><div class="stack">${panel('선발 11명과 역할',slotRows+(roleHelp?`<div class="pb muted" style="font-size:12.5px">${roleHelp}</div>`:''))}${panel('교체 명단',bench)}${panel('조직력',`<div class="pb">${cbar(u.coh)} <b>${Math.round(u.coh)}%</b><p class="muted" style="font-size:12.5px;margin:6px 0 0">경기를 함께 뛰고 전술 훈련을 하면 올라가요. 새 선수가 오면 조금 떨어져요. 조직력이 높을수록 모든 능력이 잘 발휘돼요.</p></div>`)}</div></div>`};
};

V.matches=()=>{const u=K(G.user);
  const fxs=G.F.filter(f=>f.h===u.id||f.a===u.id).sort((a,b)=>a.s-b.s);
  const rows=fxs.map(f=>{const home=f.h===u.id,op=home?f.a:f.h,r=f.r;let res='';
    if(r){const me=home?r.hg:r.ag,ot=home?r.ag:r.hg,w=r.w?r.w===u.id:me>ot,l=r.w?r.w!==u.id:me<ot;res=`<span class="form5"><i class="f${w?'W':l?'L':'D'}">${w?'승':l?'패':'무'}</i></span> <b>${r.hg}-${r.ag}</b>${r.pen?` <span class="muted">(승부차기 ${r.pen[0]}-${r.pen[1]})</span>`:r.et?' <span class="muted">(연장)</span>':''}`}
    return`<tr data-a="match" data-id="${f.id}" class="${f.s===G.slot&&!r?'me':''}"><td class="k">${fmtShort(f.s)}</td><td class="k l">${compName(f.c)}${f.leg?` <span class="muted">${f.leg}차전</span>`:''}</td><td class="k">${f.n?'중립':home?'홈':'원정'}</td><td class="club">${cl(op)}</td><td class="k">${res||(f.s===G.slot?'<b style="color:var(--accent)">오늘</b>':'')}</td></tr>`}).join('');
  return{crumb:u.name,title:'경기',body:panel(`${seasonLabel(G.season)} 시즌 일정·결과 <small>${fxs.filter(f=>f.r).length}/${fxs.length}경기</small>`,`<div class="scroll"><table class="t"><thead><tr><th>날짜</th><th class="l">대회</th><th>장소</th><th class="l">상대</th><th>결과</th></tr></thead><tbody>${rows}</tbody></table></div>`,`<span class="muted" style="font-size:12px">이후 대진은 앞 라운드가 끝나면 정해져요</span>`)};
};
function teamPreview(c){const lu=isUser(c)?userLineup(c):autoXI(c),sl=FORM[c.form];

V.prematch=()=>{const f=userFx()||nextUserFx();if(!f)return V.home();

    <div class="mn">${compName(f.c)}${f.leg?` ${f.leg}차전`:''} · ${fmtDate(slotDate(f.s))} · ${f.n?'중립 경기장':H.stadium}</div></div>
    <div class="pb"><dl class="kv"><div><dt>예상 전력</dt><dd>${H.short} ${Math.round(strength(H))} : ${Math.round(strength(A))} ${A.short}</dd></div><div><dt>최근 경기</dt><dd>${H.short} ${formIcons(fh)} · ${A.short} ${formIcons(fa)}</dd></div><div><dt>상대 포메이션</dt><dd>${op.form} · ${TACO[0][2][op.tac.ment]}${op.tac.counter?' · 역습':''}${op.tac.press===2?' · 강한 압박':''}</dd></div></dl></div>

function statBars(st){const items=[['점유율',st[0].po,st[1].po,true],['슈팅',st[0].sh,st[1].sh],['유효 슈팅',st[0].sot,st[1].sot],['패스',st[0].pa,st[1].pa],['패스 성공률',st[0].pa?Math.round(st[0].pc/st[0].pa*100):0,st[1].pa?Math.round(st[1].pc/st[1].pa*100):0,false,'%'],['태클',st[0].tk,st[1].tk],['가로채기',st[0].it,st[1].it]];
  return items.map(([l,a,b,pct,suf])=>{const t=a+b||1;let A=a,B=b;if(pct){A=Math.round(a/t*100);B=100-A}return`<div class="sbar"><span class="lbl">${l}</span><span>${A}${pct?'%':suf||''}</span><span class="bars"><i style="width:${(pct?A:a/t*100)}%"></i><i style="width:${(pct?B:b/t*100)}%"></i></span><span>${B}${pct?'%':suf||''}</span></div>`}).join('')}
function liveStats(M){return M.s.map(s=>({po:s.po,sh:s.sh,sot:s.sot,pa:Math.round(s.pa),pc:Math.round(s.pc),tk:s.tk,it:s.it}))}
V.live=()=>{const L=S.live;if(!L)return V.home();const M=L.M,[H,A]=M.s;
  const ctl=`<div id="lvBtns">${liveBtns()}</div>`;
  const hlc=`<div class="ctrl"><span class="muted" style="font-size:12.5px">장면 보기</span>${seg(['끄기','골만','골·기회'],S.hlMode,'hlm')}</div>`;
  return{crumb:compName(L.fx.c),title:`${H.c.short} vs ${A.c.short}`,body:`<section class="panel" style="--h1:${H.c.cols[0]};--a1:${A.c.cols[0]}"><div class="board"><div class="tm">${shield(H.c,40,true)}<span>${H.c.name}</span></div><div class="sc" id="lvScore">${H.g} - ${A.g}</div><div class="tm r"><span>${A.c.name}</span>${shield(A.c,40,true)}</div><div class="mn" id="lvMin">${minLabel(M)}</div></div><div class="mbar"><i id="lvBar" style="width:${Math.min(100,M.min/M.end*100)}%"></i></div>
    <div class="hl">${pitchSvg()}<div class="hlcap" id="hlCap" hidden></div></div>${ctl}${hlc}<div id="lvCtrl">${L.paused&&!L.done?liveTactics(M):''}</div></section>
    <div class="cols" style="--h1:${H.c.cols[0]};--a1:${A.c.cols[0]}">${panel('중계',`<div class="feed" id="lvFeed">${M.ev.slice().reverse().map(e=>feedLine(e,L.ui)).join('')}</div>`)}${panel('경기 기록',`<div id="lvStats">${statBars(liveStats(M))}</div>`)}</div>`};
};
function liveBtns(){const L=S.live;return L.done?`<div class="ctrl"><b>경기 종료</b><button class="btn pri" data-a="report">경기 결과 보기</button></div>`
    :`<div class="ctrl">${seg(['느리게','보통','빠르게'],L.speed,'speed')}<button class="btn ${L.paused?'pri':''}" data-a="pause">${L.paused?'▶ 경기 재개':'❚❚ 일시정지 · 전술'}</button><button class="btn" data-a="instant">바로 결과</button></div>`}
function minLabel(M){if(M.done)return M.pen?`경기 종료 · 승부차기 ${M.pen[0]}-${M.pen[1]}`:M.end===120?'연장 종료':'경기 종료';return`${M.min}분${M.min>90?' (연장)':''}${S.live&&S.live.paused?' · 일시정지':''}`}

function trSortKey(k){return{pos:p=>POSORD[p.pos],name:p=>p.n,age:p=>p.age,ca:p=>ovr(p),pa:p=>{const r=paRange(p);return(r[0]+r[1])/2},val:p=>value(p),club:p=>p.club?K(p.club).name:'~',con:p=>p.club?p.cEnd:0,nat:p=>NATS[p.nat].name}[k]||(p=>ovr(p))}
function sortPs(ps){const f=S.trf,key=trSortKey(f.sort||'ca'),d=f.dir||-1;return ps.map(p=>[p,key(p)]).sort((a,b)=>(a[1]<b[1]?-1:a[1]>b[1]?1:0)*d).map(x=>x[0])}
function searchPlayers(){const f=S.trf,out=[],qn=(f.q||'').trim();
  for(const p of Object.values(G.P)){if(p.club===G.user||(p.loan&&p.loan.from===G.user))continue;if(K(G.user).yt.includes(p.id))continue;
    if(!p.club){if(!f.fa||!G.FA.includes(p.id))continue}
    if(qn&&!p.n.includes(qn))continue;
    if(f.pos!=='전체'&&p.pos!==f.pos&&!p.alt.includes(f.pos))continue;if(f.nat!=='전체'&&p.nat!==f.nat)continue;
    if(f.lg&&f.lg!=='전체'&&(!p.club||K(p.club).cid!==f.lg))continue;if(p.age>f.age)continue;
    if(ovr(p)<f.ca)continue;if(value(p)>f.val)continue;out.push(p)}
  return sortPs(out).slice(0,100)}
function thS(k,l,cls=''){const f=S.trf,on=(f.sort||'ca')===k;return`<th class="${cls}"><button data-a="tsort" data-v="${k}" aria-pressed="${on}">${l}${on?(f.dir===1?' ▲':' ▼'):''}</button></th>`}
function plTable(ps){ps=sortPs(ps);return ps.length?`<div class="scroll"><table class="t"><thead><tr>${thS('pos','포지션')}${thS('name','이름','l')}${thS('age','나이')}${thS('ca','능력')}${thS('pa','잠재력')}${thS('club','소속','l')}${thS('val','가치')}${thS('con','계약','hide-sm')}</tr></thead><tbody>${ps.map(p=>`<tr data-a="pl" data-id="${p.id}"><td>${ptag(p.pos)}</td><td class="k l">${flag(p.nat)} ${p.n}${p.lst?'<span class="tag lst">이적 명단</span>':''}</td><td>${p.age}</td><td>${caB(ovr(p))}</td><td>${paB(p)}</td><td class="club">${p.club?`${shield(K(p.club))} ${K(p.club).short}`:'<span class="tag ok">자유계약</span>'}</td><td>${money(value(p))}</td><td class="hide-sm">${p.club?p.cEnd:'-'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="pb muted">조건에 맞는 선수가 없어요. 필터를 넓혀 보세요.</div>'}

const SKEY='fm-leagues-save-v1';
const DB={open(){return new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej(new Error('no idb'));const r=indexedDB.open('fm-leagues',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(){const db=await DB.open();return new Promise((res,rej)=>{const q=db.transaction('s').objectStore('s').get('save');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async put(v){const db=await DB.open();return new Promise((res,rej)=>{const tx=db.transaction('s','readwrite');tx.objectStore('s').put(v,'save');tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
  async del(){const db=await DB.open();return new Promise(res=>{const tx=db.transaction('s','readwrite');tx.objectStore('s').delete('save');tx.oncomplete=()=>res();tx.onerror=()=>res()})}};
let saveT=null;
function saveSoon(ms=800){clearTimeout(saveT);saveT=setTimeout(save,ms)}
async function save(){if(!G||!G.user)return;$('saveState').textContent='저장 중…';
  try{await DB.put(JSON.parse(JSON.stringify(G)));$('saveState').textContent=`저장됨 · ${fmtShort(G.slot)}`}
  catch(e){try{localStorage.setItem(SKEY,JSON.stringify(G));$('saveState').textContent='저장됨'}catch(e2){$('saveState').textContent='저장 실패';toast('저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.')}}}
async function boot(){
  let g=null;try{g=await DB.get()}catch(e){}
  if(!g){try{const s=localStorage.getItem(SKEY);if(s)g=JSON.parse(s)}catch(e){}}
  if(g&&(g.v===1||g.v===2)){migrate(g);indexFx();S.screen=G.user?'home':'pick';$('saveState').textContent='저장된 게임을 불러왔어요'}
  render();
}

  }else{
    const d=G.sp.deal;
    const deal=d?`<dl class="kv"><div><dt>메인 스폰서</dt><dd><b>${d.name}</b> · ${d.kind}</dd></div><div><dt>시즌 후원금</dt><dd>${money(d.amt)}</dd></div>${d.bonus?`<div><dt>목표 달성 보너스</dt><dd>${money(d.bonus)}</dd></div>`:''}<div><dt>남은 기간</dt><dd>이번 시즌 포함 ${d.left}시즌</dd></div></dl>`
      :`<div class="pb"><p><b>메인 스폰서가 없어요.</b></p><p class="muted">지금은 단기 광고 수입으로 시즌 ${money(sponsor(u)*0.8)} 정도만 들어와요. 곧 스폰서들이 회담을 요청할 거예요.</p></div>`;
    const pend=G.sp.pend?`<div class="offer"><span style="font-size:20px">🤝</span><div class="txt"><b>${G.sp.pend.name}</b> · ${{main:'메인 스폰서 계약',promo:'광고 촬영 제안',bonus:'성적 보너스 계약'}[G.sp.pend.type]}<br><span class="muted">${Math.max(1,Math.round((G.sp.pend.exp-G.slot)*3.5))}일 안에 만나야 해요</span></div><button class="btn pri" data-a="spStart">회담 시작</button></div>`:'<div class="pb muted">대기 중인 회담이 없어요.</div>';
    const extra=G.sp.extra.length?`<dl class="kv">${G.sp.extra.map(b=>`<div><dt>${b.name}</dt><dd>리그 ${b.tgt}위 이내 시 ${money(b.amt)}</dd></div>`).join('')}</dl>`:'<div class="pb muted">이번 시즌 보너스 계약이 없어요.</div>';
    const log=G.sp.log.length?`<div class="news">${G.sp.log.map(l=>`<article><span class="ic">🤝</span><div><small>${fmtDate(slotDate(l.d,l.s))}</small><p style="color:var(--ink)">${esc(l.t)}</p></div></article>`).join('')}</div>`:'<div class="pb muted">아직 기록이 없어요.</div>';
    body=`<div class="cols"><div class="stack">${panel('메인 스폰서',deal)}${panel('스폰서 관계',`<div class="pb">${cbar(G.sp.rel)} <b>${Math.round(G.sp.rel)}</b><p class="muted" style="font-size:12.5px;margin:6px 0 0">관계가 좋을수록 처음 제안 금액이 크고, 조건을 올려 달라고 할 때 성공하기 쉬워요. 회담을 미루거나 무리하게 요구하면 관계가 나빠져요.</p></div>`)}</div><div class="stack">${panel('대기 중인 회담',pend)}${panel('보너스 계약',extra)}${panel('회담 기록',log)}</div></div>`;
  }
  return{crumb:u.name,title:'대외 활동',sub:[['press','기자회견'],['sponsor','스폰서']].map(([v,l])=>`<button class="chip" aria-pressed="${t===v}" data-a="mTab" data-v="${v}">${l}</button>`).join(''),body};
};
// 기자회견 대화창
function pressRender(){const pr=S.pr;if(!pr)return;const q=pr.qs[pr.i];
  if(!q){pressFinish(pr);openSheet(pr.kind==='pre'?'경기 전 기자회견':'경기 후 기자회견',`<p>회견이 끝났어요.</p><dl class="kv">${pr.log.map(x=>`<div><dt>${esc(x.a)}</dt><dd class="muted">${esc(x.e)}</dd></div>`).join('')}</dl><div class="btns"><button class="btn pri" data-a="prClose">확인</button></div>`);saveSoon();return}
  openSheet(`${pr.kind==='pre'?'경기 전':'경기 후'} 기자회견 · 질문 ${pr.i+1}/${pr.qs.length}`,`${pr.last?msg(`반응: ${esc(pr.last)}`,null):''}<p style="font-size:15px"><b>기자:</b> ${esc(q.q)}</p><div class="stack" style="gap:8px">${q.o.map((o,i)=>`<button class="btn" style="text-align:left;padding:10px 12px" data-a="pressAns" data-i="${i}">“${esc(o.t)}”</button>`).join('')}</div><button class="btn" data-a="pressSkip" style="align-self:flex-start">이 질문은 넘기기</button>`)}
// 스폰서 대화창
function spRender(res){spInit();const o=G.sp.pend;let b='';
  if(res)b+=msg(esc(res.msg),res.ok===false?false:res.ok?true:null);
  if(!o||(res&&res.done)){openSheet('스폰서 회담',b+'<div class="btns"><button class="btn pri" data-a="spClose">확인</button></div>');return}
  const pushBtn=`<button class="btn" data-a="spAns" data-v="push">조건을 더 올려 주세요</button>`,noBtn=`<button class="btn bad" data-a="spAns" data-v="no">거절</button>`;
  if(o.type==='main')b+=`<p><b>${o.name} 마케팅 이사:</b> 귀 구단의 메인 스폰서가 되고 싶습니다. 시즌당 <b>${money(o.amt)}</b>을 기준으로 세 가지 방식을 제안드립니다.</p>
    <div class="stack" style="gap:8px"><button class="btn" style="text-align:left;padding:10px 12px" data-a="spAns" data-v="fixed"><b>2시즌 고정</b> · 시즌당 ${money(o.amt)}</button><button class="btn" style="text-align:left;padding:10px 12px" data-a="spAns" data-v="perf"><b>1시즌 성과 연동</b> · ${money(r1(o.amt*0.85))} + 이사회 목표 달성 시 ${money(r1(o.amt*0.4))}</button><button class="btn" style="text-align:left;padding:10px 12px" data-a="spAns" data-v="long"><b>3시즌 장기</b> · 시즌당 ${money(r1(o.amt*0.95))}</button></div><div class="btns">${pushBtn}${noBtn}</div>`;
  else if(o.type==='promo')b+=`<p><b>${o.name} 홍보 담당:</b> ${o.stars.map(id=>P(id)?P(id).n:'').filter(Boolean).join(', ')} 선수가 나오는 광고를 찍고 싶습니다. 촬영비로 <b>${money(o.amt)}</b>을 드리겠습니다.</p><p class="muted" style="font-size:12.5px">촬영에 나간 선수는 컨디션이 15 떨어지고, 바쁜 일정에 사기도 조금 떨어져요.</p>
    <div class="btns"><button class="btn pri" data-a="spAns" data-v="stars">그 선수들로 촬영 (${money(o.amt)})</button><button class="btn" data-a="spAns" data-v="young">어린 선수로 대신 (${money(r1(o.amt*0.45))})</button>${pushBtn}${noBtn}</div>`;
  else b+=`<p><b>${o.name} 영업 이사:</b> 이번 시즌 리그 <b>${o.tgt}위 이내</b>로 마치면 <b>${money(o.amt)}</b>을 보너스로 드리겠습니다. 손해 볼 일은 없는 제안입니다.</p><div class="btns"><button class="btn pri" data-a="spAns" data-v="ok">계약하기</button>${pushBtn}${noBtn}</div>`;
  openSheet(`스폰서 회담 · ${o.name}`,b)}
Object.assign(A,{
  mTab:el=>{S.mtab2=el.dataset.v;render()},
  pressStart:el=>{const k=el.dataset.k,f=pressAvail(k);if(!f)return toast('지금은 열 수 없는 회견이에요');S.pr=pressBuild(k,f);S.pr.last=null;pressRender()},
  pressAns:el=>{const pr=S.pr,q=pr.qs[pr.i],o=q.o[+el.dataset.i];const e=pressApply(pr,o.e);pr.log.push({q:q.q,a:o.t,e});pr.last=e;pr.i++;pressRender()},
  pressSkip:()=>{const pr=S.pr,q=pr.qs[pr.i];pr.log.push({q:q.q,a:'(대답하지 않음)',e:'별다른 반응이 없어요'});pr.last='대답을 피했어요';pr.i++;pressRender()},
  prClose:()=>{S.pr=null;closeSheet();render()},
  spStart:()=>{spInit();if(!G.sp.pend)return toast('대기 중인 회담이 없어요');spRender(null)},
  spAns:el=>{const r=spRespond(el.dataset.v);saveSoon();spRender(r)},
  spClose:()=>{closeSheet();render()}
});
// ============================================================
// 36. JSON 파일 저장·불러오기
// ============================================================
let DLCAP=null;
if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{DLCAP=d}).catch(()=>{});
function saveFileName(){const u=G.user&&K(G.user);const d=new Date(),p=n=>String(n).padStart(2,'0');
  return`fm-league-${u?u.short:'save'}-${G.season}-${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`}
async function exportJSON(){if(!G||!G.user)return toast('저장할 게임이 없어요');
  const str=JSON.stringify(G),name=saveFileName(),blob=new Blob([str],{type:'application/json'});
  if(DLCAP){try{await DLCAP.save({filename:name,data:blob});toast('JSON 파일로 저장했어요')}
    catch(e){const c=e&&e.code;toast(c==='declined'?'파일 저장을 취소했어요':c==='rate_limited'?'이미 저장 창이 열려 있어요. 잠시 뒤 다시 시도해 주세요':'이 화면에서는 파일로 저장할 수 없어요')}return}
  try{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('JSON 파일을 내려받았어요')}
  catch(e){toast('이 화면에서는 파일로 저장할 수 없어요')}}
function validSave(g){return g&&typeof g==='object'&&(g.v===1||g.v===2)&&g.K&&g.P&&g.D&&Array.isArray(g.F)&&typeof g.season==='number'}
let PENDING_LOAD=null;
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.ch!=='loadFile')return;const f=el.files&&el.files[0];el.value='';if(!f)return;
  const rd=new FileReader();rd.onload=()=>{let g=null;try{g=JSON.parse(rd.result)}catch(err){}
    if(!validSave(g))return openSheet('불러오기 실패',msg('이 게임의 저장 파일이 아니거나 파일이 손상됐어요.',false)+'<div class="btns"><button class="btn pri" data-a="closeSheet">확인</button></div>');
    PENDING_LOAD=g;const c=g.user&&g.K[g.user];
    openSheet('저장 파일 불러오기',`<dl class="kv"><div><dt>파일</dt><dd>${esc(f.name)}</dd></div><div><dt>클럽</dt><dd>${c?esc(c.name):'선택 전'}</dd></div><div><dt>감독</dt><dd>${g.mgr?esc(g.mgr.name):'-'}</dd></div><div><dt>시즌</dt><dd>${seasonLabel(g.season)} · ${fmtDate(slotDate(g.slot,g.season))}</dd></div></dl>
      ${G&&G.user?msg('지금 진행 중인 게임은 이 파일 내용으로 바뀌어요. 필요하면 먼저 JSON 파일로 저장해 두세요.'):''}<div class="btns"><button class="btn pri" data-a="loadYes">불러오기</button><button class="btn" data-a="closeSheet">취소</button></div>`)};
  rd.onerror=()=>toast('파일을 읽지 못했어요');rd.readAsText(f)});
const fileBtns=()=>`<div class="btns"><button class="btn pri" data-a="exportJSON">JSON 파일로 저장</button><label class="btn" style="cursor:pointer">JSON 파일 불러오기<input type="file" accept=".json,application/json" data-ch="loadFile" hidden></label></div>`;
Object.assign(A,{
  exportJSON:()=>exportJSON(),
  loadYes:()=>{const g=PENDING_LOAD;PENDING_LOAD=null;if(!g)return;if(S.live)clearTimeout(S.live.timer);stopHL();S.live=null;S.hist=[];
    migrate(g);indexFx();S.screen=G.user?'home':'pick';closeSheet();save();render();toast('저장 파일을 불러왔어요')}
});
// 시작 화면과 구단 화면에 버튼 추가
const _start=V.start;V.start=()=>{const v=_start();
  v.body+=`<div class="start" style="margin-top:0">${panel('저장 파일','<div class="pb"><p>예전에 JSON 파일로 저장한 게임을 불러와 이어서 할 수 있어요.</p>'+fileBtns()+'</div>')}</div>`;return v};
const _club=V.club;V.club=()=>{const v=_club();v.body+=panel('저장 관리',`<div class="pb"><p>게임은 이 브라우저에 자동 저장돼요. JSON 파일로 저장해 두면 다른 기기나 브라우저에서 불러오거나, 원하는 시점으로 되돌릴 수 있어요.</p>${fileBtns()}</div>`);return v};

</script>
